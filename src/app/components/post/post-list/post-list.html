<div *ngFor="let post of posts$ | async" class="mb-6 rounded-lg bg-white p-4 shadow-md">

  <div class="mb-3 flex items-center">
    <img [src]="post.authorPhotoURL || 'assets/images/default-avatar.png'" 
         alt="Author" 
         class="mr-3 h-10 w-10 rounded-full object-cover">

    <div>
      <h4 class="font-bold text-gray-900">{{ post.authorName }}</h4>
      <p class="text-xs text-gray-500">
        {{ post.createdAt.toDate() | date:'medium' }}
      </p>
    </div>
  </div>

  <p class="text-gray-800 whitespace-pre-wrap">{{ post.content }}</p>

  <div class="mt-4 flex items-center border-t border-gray-100 pt-3">
    <button class="flex items-center text-gray-500 hover:text-blue-600">
      <span class="text-sm font-semibold">Like</span>
    </button>
    </div>
</div>

<div *ngIf="(posts$ | async)?.length === 0" class="text-center text-gray-500 py-10">
  No posts yet. Be the first to share something!
</div>
