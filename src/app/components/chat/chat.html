<div class="flex h-[calc(100vh-64px)] bg-gray-100">

  <aside class="w-full border-r border-gray-200 bg-white md:w-1/4 flex-shrink-0"
         [class.hidden]="selectedUser" 
         [class.block]="!selectedUser"> <div class="border-b p-4">
      <h2 class="text-xl font-bold text-gray-800">Chats</h2>
    </div>

    <div class="overflow-y-auto h-full">
      <div *ngFor="let user of users$ | async" 
           (click)="selectUser(user)"
           class="flex cursor-pointer items-center border-b border-gray-50 p-4 hover:bg-blue-50"
           [class.bg-blue-100]="selectedUser?.uid === user.uid">

        <img [src]="user.photoURL" referrerpolicy="no-referrer" class="mr-3 h-12 w-12 rounded-full object-cover">
        <div>
          <h3 class="font-semibold text-gray-900">{{ user.displayName }}</h3>
          <p class="text-xs text-gray-500">Click to chat</p>
        </div>
      </div>
    </div>
  </aside>

  <main class="flex w-full flex-col md:w-3/4"
        [class.hidden]="!selectedUser" 
        [class.flex]="selectedUser"> <ng-container *ngIf="selectedUser; else noChatSelected">

      <div class="flex items-center justify-between border-b border-gray-200 bg-white p-4 shadow-sm">
        <div class="flex items-center">
          <button (click)="selectedUser = null" class="mr-3 text-gray-500 md:hidden">
            ←
          </button>
          <img [src]="selectedUser.photoURL" referrerpolicy="no-referrer" class="mr-3 h-10 w-10 rounded-full">
          <div>
            <h3 class="font-bold text-gray-900">{{ selectedUser.displayName }}</h3>
            <p class="text-xs text-green-500">Online</p>
          </div>
        </div>
      </div>

      <div #scrollContainer class="flex-grow overflow-y-auto bg-gray-50 p-4">
        <div class="flex flex-col space-y-2">

          <ng-container *ngIf="auth.user$ | async as currentUser">
            <div *ngFor="let msg of messages$ | async" 
                 class="flex w-full"
                 [class.justify-end]="msg.senderId === currentUser.uid"
                 [class.justify-start]="msg.senderId !== currentUser.uid">

              <div class="max-w-[70%] rounded-lg px-4 py-2 shadow-sm"
                   [class.bg-blue-600]="msg.senderId === currentUser.uid"
                   [class.text-white]="msg.senderId === currentUser.uid"
                   [class.bg-white]="msg.senderId !== currentUser.uid"
                   [class.text-gray-800]="msg.senderId !== currentUser.uid">
                <p>{{ msg.text }}</p>
                <p class="mt-1 text-right text-[10px] opacity-70">
                  {{ msg.sentAt.toDate() | date:'shortTime' }}
                </p>
              </div>
            </div>
          </ng-container>

        </div>
      </div>

      <div class="bg-white p-4 border-t border-gray-200">
        <div class="flex items-center space-x-2">
          <input [(ngModel)]="newMessage" 
                 (keydown.enter)="sendMessage()"
                 type="text" 
                 placeholder="Write a message..." 
                 class="flex-grow rounded-full border border-gray-300 bg-gray-100 px-4 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none">

          <button (click)="sendMessage()" 
                  [disabled]="!newMessage.trim()"
                  class="rounded-full bg-blue-600 p-2 text-white hover:bg-blue-700 disabled:opacity-50">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
              <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
            </svg>
          </button>
        </div>
      </div>

    </ng-container>

    <ng-template #noChatSelected>
      <div class="flex h-full flex-col items-center justify-center text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-24 w-24 mb-4 opacity-20"><path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12.125a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-3.86 8.25-8.625 8.25a8.625 8.625 0 01-8.625-8.25c0-4.556 3.86-8.25 8.625-8.25 4.765 0 8.625 3.694 8.625 8.25z" /></svg>
        <p class="text-lg">Select a user to start chatting</p>
      </div>
    </ng-template>

  </main>
</div>
