<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
  <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-xl">

    <h2 class="mb-4 text-xl font-bold">Create New Event</h2>

    <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Event Title</label>
        <input formControlName="title" type="text" class="mt-1 w-full rounded-md border border-gray-300 p-2" placeholder="e.g. Coding Workshop">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Location</label>
        <input formControlName="location" type="text" class="mt-1 w-full rounded-md border border-gray-300 p-2" placeholder="e.g. Warsaw Office or Online">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Date & Time</label>
        <input formControlName="date" type="datetime-local" class="mt-1 w-full rounded-md border border-gray-300 p-2">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Description</label>
        <textarea formControlName="description" rows="3" class="mt-1 w-full rounded-md border border-gray-300 p-2"></textarea>
      </div>

      <div class="flex justify-end space-x-2">
        <button type="button" (click)="closeModal()" class="rounded-md bg-gray-200 px-4 py-2 text-gray-700 hover:bg-gray-300">
          Cancel
        </button>
        <button type="submit" [disabled]="eventForm.invalid || isSubmitting" 
          class="rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:opacity-50">
          {{ isSubmitting ? 'Creating...' : 'Create Event' }}
        </button>
      </div>
    </form>

  </div>
</div>
